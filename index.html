<title>نظام هوية مأذوني الأنكحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --deep:#0b3b2b; --green:#10553e; --green-2:#1b6a4f; --green-soft:#e3eee8;
  --cream:#e9e1d6; --sand:#d1ad8c; --sand-d:#9c7650; --sand-soft:#f5ece2;
  --bg:#f3f4f0; --surface:#fff; --line:#dde2db; --line-2:#eceee9;
  --ink:#15231c; --muted:#5d6a62; --red:#a23b2c; --red-soft:#f7e6e2; --amber:#9a6a12; --amber-soft:#fbf1dc;
  --plex:"IBM Plex Sans Arabic",Tahoma,sans-serif; --amiri:"Amiri",serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.6 var(--plex);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ─── الترويسة ─── */
.top{position:relative;background:linear-gradient(160deg,var(--deep),var(--green));color:var(--cream);overflow:hidden}
.top canvas{position:absolute;inset:0;width:100%;height:100%}
.top-in{position:relative;max-width:1280px;margin:auto;padding:18px 24px 0;display:flex;align-items:center;gap:16px}
.top svg.logo{width:92px;height:auto;color:var(--cream);flex:none}
.top h1{font:700 26px/1.2 var(--amiri);margin:0}
.top .who{margin-inline-start:auto;display:flex;align-items:center;gap:12px;font-size:14px}
.top .who b{font-weight:600}
.top .who small{display:block;color:var(--sand);font-size:12px}
.btn-out{background:transparent;border:1px solid rgba(233,225,214,.4);color:var(--cream);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn-out:hover{background:rgba(233,225,214,.1)}
.top .sync{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sand)}
.top .sync .btn-out{padding:4px 10px;font-size:12px}

nav.tabs{position:relative;max-width:1280px;margin:auto;padding:14px 18px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:rgba(233,225,214,.75);padding:10px 14px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button:hover{color:var(--cream)}
nav.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--sand)}

main{max-width:1280px;margin:auto;padding:24px}
h2.page{font:700 28px/1.3 var(--amiri);margin:0 0 4px;color:var(--deep)}
p.lead{margin:0 0 20px;color:var(--muted)}
h3{font-size:16px;margin:0 0 12px;font-weight:600;color:var(--deep)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
.stack{display:grid;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ─── الأزرار والحقول ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--deep)}
.btn.ghost{background:var(--surface);color:var(--green);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--green);background:var(--green-soft)}
.btn.danger{background:var(--surface);color:var(--red);border-color:#e7c9c3}
.btn.danger:hover{background:var(--red-soft)}
.btn.wa{background:#1f7a4d;border-color:#1f7a4d}
.btn.wa:hover{background:#155c39}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:16px}
.btn[disabled],.btn.disabled{opacity:.5;pointer-events:none}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:500}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px}
.in:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px var(--green-soft)}
textarea.in{min-height:80px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fields .wide{grid-column:1/-1}

/* ─── الأرقام ─── */
.figs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.fig{padding:18px 20px;border-inline-start:1px solid var(--line-2)}
.fig:first-child{border-inline-start:0}
.fig b{display:block;font:600 32px/1.1 var(--plex);font-variant-numeric:tabular-nums;color:var(--deep)}
.fig span{font-size:13px;color:var(--muted)}
.fig.hl b{color:var(--green)}
.overall{grid-column:1/-1;border-top:1px solid var(--line-2);padding:14px 20px;display:flex;gap:16px;align-items:center;font-size:13px;color:var(--muted)}
.bar{position:relative;height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;flex:1;min-width:80px}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--sand);border-radius:99px}
.bar i.r{background:var(--green)}
.alerts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.alert{display:flex;gap:10px;align-items:center;background:var(--amber-soft);border:1px solid #ecd9ae;color:#5d430c;border-radius:8px;padding:10px 14px;cursor:pointer;text-align:start}
.alert b{font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.chart .c{width:100%;max-width:26px;background:var(--sand);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.chart .c i{position:absolute;inset-inline:0;bottom:0;background:var(--green);border-radius:4px 4px 0 0}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}

/* ─── الجداول ─── */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel .tbl-wrap{border:0;border-radius:0;margin:0 -18px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbf9}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#f8faf7}
.tbl tr.sel{background:var(--green-soft)}
.tbl .name{font-weight:600;color:var(--deep)}
.tbl td:has(> .name){min-width:210px}
.tbl .cut{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tbl .acts{white-space:nowrap;text-align:end}
.tbl input[type=checkbox]{width:17px;height:17px;accent-color:var(--green)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip.no{background:#eef0ec;color:#55615a}
.chip.sent{background:var(--sand-soft);color:#7a5632;border-color:#ead6bf}
.chip.yes{background:var(--green-soft);color:var(--green)}
.chip.nr{background:var(--red-soft);color:var(--red)}
.chip.wait{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.off{background:#eee;color:#777}

.toolbar{display:grid;grid-template-columns:2fr repeat(6,1fr);gap:10px;margin-bottom:12px}
.bulk{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--deep);color:var(--cream);padding:10px 14px;border-radius:var(--r);margin-bottom:12px}
.bulk .btn.ghost{background:transparent;color:var(--cream);border-color:rgba(233,225,214,.35)}
.bulk .btn.ghost:hover{background:rgba(233,225,214,.1)}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 2px;color:var(--muted);font-size:13px}

/* ─── المنسق ─── */
.today{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:16px}
.today b{font-size:22px;color:var(--deep);font-variant-numeric:tabular-nums}
.today.over{border-color:#e7c9c3;background:var(--red-soft)}
.seg{display:flex;gap:4px;background:#e7ebe5;border-radius:10px;padding:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:10px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-selected=true]{background:var(--surface);color:var(--deep);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button em{font-style:normal;font-variant-numeric:tabular-nums;margin-inline-start:6px;color:var(--sand-d)}
.people{display:grid;gap:8px}
.person{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;cursor:pointer}
.person:hover{border-color:var(--green)}
.person .who{flex:1;min-width:0}
.person .who b{display:block;color:var(--deep);font-weight:600}
.person .who span{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.person .note{font-size:12.5px;color:var(--sand-d);margin-top:2px}

/* ─── النوافذ ─── */
.modal{position:fixed;inset:0;background:rgba(11,59,43,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow-y:auto}
.sheet{background:var(--surface);border-radius:14px;width:min(960px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.narrow{width:min(560px,100%)}
.sheet header{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line-2)}
.sheet header h3{font:700 22px/1.3 var(--amiri);margin:0;color:var(--deep)}
.sheet header p{margin:2px 0 0;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.sheet header .x{margin-inline-start:auto;background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px}
.sheet .body{padding:20px 22px}
.sheet footer{display:flex;gap:10px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.idgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:24px}
.preview{background:var(--cream);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.preview canvas{width:100%;height:auto;border-radius:6px;display:block;box-shadow:0 2px 10px rgba(11,59,43,.15)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:22px;align-content:start}
.steps li{counter-increment:s;position:relative;padding-inline-start:40px}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:600;font-size:14px}
.steps li.done::before{content:"✓";background:var(--green);color:#fff}
.steps li.locked{opacity:.45}
.steps li.note-li{counter-increment:none;padding-inline-start:40px}
.steps li.note-li::before{display:none}
.steps li b{display:block;margin-bottom:6px;font-weight:600}
.sentline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--green-soft);color:var(--green);border-radius:8px;padding:8px 12px;font-size:14px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:500}
.choice button[aria-pressed=true].y{background:var(--green);border-color:var(--green);color:#fff}
.choice button[aria-pressed=true].n{background:var(--red);border-color:var(--red);color:#fff}
.choice button[aria-pressed=true].u{background:var(--muted);border-color:var(--muted);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.cands{max-height:440px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.msgbox{background:#e7f3ea;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.8;white-space:pre-wrap;position:relative}
.msgbox::after{content:attr(data-n);display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.custnote{background:var(--sand-soft);border:1px solid #ead6bf;color:#6b4a26;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.sheet header .btn{align-self:center}

/* ─── الدخول ─── */
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,var(--deep),var(--green));position:relative;overflow:hidden;padding:20px}
.login canvas{position:absolute;inset:0;width:100%;height:100%}
.login .card{position:relative;background:var(--surface);border-radius:16px;padding:34px 30px 28px;width:min(400px,100%);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.login svg{width:150px;color:var(--green);margin-bottom:6px}
.login h1{font:700 26px/1.3 var(--amiri);margin:0 0 4px;color:var(--deep)}
.login p{margin:0 0 22px;color:var(--muted);font-size:14px}
.login .in{text-align:center;font-size:20px;letter-spacing:4px;padding:12px}
.login .err{color:var(--red);font-size:14px;min-height:22px;margin:10px 0 0}

/* ─── رسائل سريعة ─── */
#toasts{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);display:grid;gap:8px;z-index:90;width:min(440px,92vw)}
.toast{background:var(--deep);color:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px}
.toast.err{background:var(--red)}
.toast.warn{background:#7a5410}
.loading{padding:50px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

@media (max-width:980px){
  .figs{grid-template-columns:repeat(3,1fr)}
  .fig:nth-child(4){border-inline-start:0}
  .fig:nth-child(n+4){border-top:1px solid var(--line-2)}
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar .search{grid-column:1/-1}
  .idgrid{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:600px){
  main{padding:16px 12px}
  .top-in{padding:14px 14px 0}
  .top svg.logo{width:64px}
  .top h1{font-size:20px}
  .top .who b,.top .who small,.top .sync>span{display:none}
  .figs{grid-template-columns:repeat(2,1fr)}
  .fig:nth-child(odd){border-inline-start:0}
  .fig:nth-child(n+3){border-top:1px solid var(--line-2)}
  .fig b{font-size:26px}
  .person{flex-wrap:wrap}
  .modal{padding:0}
  .sheet{border-radius:0;min-height:100vh}
}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span> جارٍ التحميل…</div></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<!-- ═══════════════════════════════════════════════════════════
     محرك تصاميم الهوية (Studio) — مأخوذ من «استوديو هوية مأذوني عقود الأنكحة»
     لا يحتاج تعديلاً: يستقبل بيانات المأذون من النظام ويرسم الهوية ويصنع ملفاتها
     ═══════════════════════════════════════════════════════════ -->
<script>
window.Studio = (function () {

/* =========================================================
   الإعدادات الافتراضية — غيّر القيم هنا لتظهر تلقائيًا عند فتح الصفحة
   ========================================================= */
const CONFIG = {
  name:    "",                        // اسم المأذون
  city:    "",                        // المدينة
  phone:   "",                        // رقم الجوال
  license: "",                        // رقم الرخصة
  tagline: "مأذون مواطنين ومقيمين",    // الوصف تحت الشعار
  sender:  "عبدالكريم بن ضبعان",      // اسم المُهدي
  qr:      true                       // رمز واتساب على البطاقة
};

/* ---------- ألوان الهوية ---------- */
const C = { green:"#10553e", cream:"#e9e1d6", sand:"#d1ad8c", deep:"#0b3b2b", paper:"#f8f5f0", black:"#000000", sandDark:"#9c7650" };

function sub(fn, w, h, k = 1) { const c = document.createElement("canvas"); c.width = w * k; c.height = h * k; const x = c.getContext("2d"); x.scale(k, k); fn(x); return c; }
function placeDesign(ctx, key, d, x, y, w, shadow = true) {
  const des = D[key], k = (w / des.W) * 1.6;

  ctx.restore();
  return h;
}

<script>
/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
const S = {
  token: null, user: null, meta: null, tab: null,
  q: { page: 1, recordStatus: 'active' }, sel: new Set(),
  cq: { view: 'tosend', shown: 60 }, navIds: [], cand: null, body: null, since: 0, syncing: false, lastSync: 0
};
const DB = { map: new Map(), list: [], dirty: true };
const PAGE = 100;
const SENT = 'تم الإرسال', NOTSENT = 'لم يُرسل', ACTIVE = 'نشط', OK = 'سليم';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

 * لأن النطاق مشترك مع موقع الحجز */

  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };

/* ─── التواريخ بتوقيت الرياض ─── */
const FMT = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const DAY = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit' });
const fmt = ms => { if (!ms) return ''; const p = {}; FMT.formatToParts(new Date(ms)).forEach(x => p[x.type] = x.value); return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const dayOf = ms => ms ? DAY.format(new Date(ms)) : '';
const hhmm = ms => fmt(ms).slice(11);

/* ─── توحيد النص للبحث (مثل الخادم) ─── */
const latin = s => String(s == null ? '' : s).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
const norm = s => latin(s).replace(/[\u064B-\u0652\u0670\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
  .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/(^|\s)عبد\s+/g, '$1عبد').replace(/\s+/g, ' ').trim().toLowerCase();

/* ═══════════════ الاتصال بالخادم ═══════════════ */
/* من رابط جوجل القديم: google.script.run. ومن GitHub Pages: doPost على رابط الخلفية (HAWIYYAT_API) */
const IS_GAS = !!(window.google && google.script);
function failed(err) {
  const m = String((err && err.message) || err).replace(/^(Error|Exception):\s*/, '');
  if (m.indexOf('SESSION_EXPIRED') > -1) { signOut(true); toast('انتهت الجلسة، ادخل برمزك من جديد.', 'warn'); }
  return new Error(m);
}
function api(fn, ...args) {
  if (!IS_GAS) {
    if (!window.HAWIYYAT_API) return Promise.reject(new Error('افتح النظام من رابطه المنشور.'));
    // text/plain حتى لا يطلب المتصفح إذناً مسبقاً (CORS) من جوجل
    return fetch(window.HAWIYYAT_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args }), credentials: 'omit', redirect: 'follow', cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('تعذر الاتصال بالخادم، حاول مجدداً.'); return r.json(); },
        () => { throw new Error('تعذر الاتصال بالخادم. تأكد من الإنترنت ثم حاول مجدداً.'); })
      .then(o => { if (!o || !o.ok) throw failed((o && o.error) || 'خطأ غير معروف.'); return o.r; });

const call = (fn, ...a) => api(fn, S.token, ...a);

/* ═══════════════ البيانات المحلية ═══════════════ */
function unpack(p) {
  if (!p) return [];
  return p.rows.map(row => {
    const x = {};
    for (let i = 0; i < p.cols.length; i++) { const k = p.cols[i], v = row[i]; x[k] = p.dict[k] ? p.dict[k][v] : v; }
    return prep(x);
  });
}

  x.stage = x.sendStatus !== SENT ? 'tosend' : !x.replyStatus ? 'followup' : (x.replyStatus === 'رد' && !x.fileSentAt) ? 'sendfile' : 'done';
  x._s = norm([x.name, x.city, x.district, x.court, x.id, x.notes].join(' '));
  x._d = [x.phone, latin(x.phoneRaw).replace(/\D/g, ''), x.license, x.id].join(' ');
  x._sentDay = dayOf(x.sentAt); x._replyDay = dayOf(x.replyAt);

  return x;
}

  rows.forEach(x => { if (!DB.map.has(x.id)) added = true; DB.map.set(x.id, x); });

}
function removeIds(ids) { let c = 0; ids.forEach(id => { if (DB.map.delete(id)) c++; }); if (c) { DB.dirty = true; upsert([]); } return c; }
const rec = id => DB.map.get(id);
const batchOf = id => (S.meta.batches || []).find(b => b.id === id);
const userName = id => ((S.meta.coords || []).find(c => c.id === id) || {}).name || '';
function applyMeta(m) {
  const sig = x => x ? JSON.stringify([x.settings, x.templates, x.batches, (x.coords || []).map(c => [c.id, c.name, c.role, c.active, c.timer, c.gap])]) : '';
  const ch = sig(m) !== sig(S.meta); S.meta = m; return ch;
}

/* القيم الأصلية للهوية من البيانات، ثم يُطبّق فوقها تعديل الهوية الخاص (إن وُجد) */
function identityBase(x) {
  const st = S.meta.settings, b = batchOf(x.batchId);
  return { name: x.name, phone: x.phoneLocal, city: x.city || '', license: x.license || '',
    tagline: x.contractType || st.tagline, sender: x.sender || (b && b.sender) || st.sender };
}
function identityOf(x, over) {
  const st = S.meta.settings, base = identityBase(x), c = over || x._c || {};
  const v = k => c[k] || base[k];
  const data = { name: v('name'), city: v('city'), phone: v('phone'), license: v('license'), tagline: v('tagline'), sender: v('sender'),
    qr: st.qr !== 'لا' && !c.hideQr, hideCity: !!c.hideCity, hideLicense: !!c.hideLicense };
  const message = String(st.message).replace(/\{الاسم\}/g, data.name).replace(/\{المدينة\}/g, data.hideCity ? '' : data.city)
    .replace(/\{المهدي\}/g, data.sender).replace(/\{رقم_الترخيص\}/g, data.hideLicense ? '' : data.license);
  return { data, sender: data.sender, message, custom: !!x._c, wa: x.phone ? 'https://wa.me/' + x.phone + '?text=' + encodeURIComponent(message) : '' };
}
const customBadge = r => r._c ? ' <span class="chip sent" title="عُدّلت الهوية بطلب المأذون">هوية معدّلة</span>' : '';

/* ═══════════════ المزامنة ═══════════════ */
async function sync(manual) {

    const r = await call('api_changes', S.since - 5000);
    const metaCh = applyMeta(r.meta);

  btn.innerHTML = '<span class="spin"></span> ' + (btn.dataset.busy || 'لحظة…');

}

function chipReply(r) {
  if (r.sendStatus !== SENT) return '<span class="muted">—</span>';
  if (r.replyStatus === 'رد') return '<span class="chip yes">رد</span>';
  if (r.replyStatus === 'لم يرد') return '<span class="chip nr">لم يرد</span>';

function phoneCell(r) {

  return `<span class="chip bad">${esc(r.phoneStatus)}</span> <span class="ltr num muted small">${esc(r.phoneRaw)}</span>`;

function logoSvg(cls) {
  return `<svg class="${cls || ''}" viewBox="0 0 ${Studio.LOGO_W} ${Studio.LOGO_H}" role="img" aria-label="شعار مأذون عقود الأنكحة"><g transform="translate(0,${Studio.LOGO_H}) scale(0.1,-0.1)" fill="currentColor">${Studio.LOGO_PATHS.map(d => `<path d="${d}"/>`).join('')}</g></svg>`;

/* ═══════════════ الدخول ═══════════════ */

  <div class="login"><canvas aria-hidden="true"></canvas>
    <form class="card" id="loginForm">
      ${logoSvg()}

  DB.map.clear(); DB.dirty = true; upsert(unpack(boot.data));

  go(S.user.isAdmin ? 'dash' : 'coord');
}

/* ═══════════════ الأرقام (تُحسب محلياً) ═══════════════ */
function computeStats() {
  const T = { total: 0, valid: 0, phoneProblems: 0, alerts: 0, sent: 0, remaining: 0, replied: 0, noReply: 0, pending: 0, inBatches: 0, unassigned: 0, dup: 0, excluded: 0 };
  const byBatch = {}, byCity = {}, byCoord = {}, daily = {};
  const today = dayOf(Date.now());
  for (let i = 13; i >= 0; i--) daily[dayOf(Date.now() - i * 864e5)] = { sent: 0, replies: 0 };
  for (const r of DB.list) {
    if (r.recordStatus === 'مكرر') { T.dup++; continue; }
    if (r.recordStatus === 'مستبعد') { T.excluded++; continue; }
    if (r.recordStatus !== ACTIVE) continue;
    T.total++;
    const ok = r.phoneStatus === OK, sent = r.sendStatus === SENT, rep = r.replyStatus;
    if (ok) T.valid++; else T.phoneProblems++;
    if (r.alert) T.alerts++;
    if (r.fileSentAt) T.fileSent = (T.fileSent || 0) + 1;
    if (sent) { T.sent++; if (rep === 'رد') T.replied++; else if (rep === 'لم يرد') T.noReply++; else T.pending++; }
    else if (ok) { T.remaining++; if (r.batchId) T.inBatches++; else T.unassigned++; }
    const c = r.city || '(بدون مدينة)';
    const co = byCity[c] || (byCity[c] = { city: c, total: 0, sent: 0, replied: 0, free: 0 });
    co.total++; if (sent) co.sent++; if (rep === 'رد') co.replied++;
    if (ok && !sent && !r.batchId) co.free++;
    if (r.batchId) { const b = byBatch[r.batchId] || (byBatch[r.batchId] = { total: 0, sent: 0, replied: 0, noReply: 0 }); b.total++; if (sent) b.sent++; if (rep === 'رد') b.replied++; if (rep === 'لم يرد') b.noReply++; }
    if (sent && r.sentBy) {
      const o = byCoord[r.sentBy] || (byCoord[r.sentBy] = { sentTotal: 0, sentToday: 0, replied: 0, noReply: 0, pending: 0, last: 0 });
      o.sentTotal++; if (r._sentDay === today) o.sentToday++;
      if (rep === 'رد') o.replied++; else if (rep === 'لم يرد') o.noReply++; else o.pending++;
      o.last = Math.max(o.last, r.sentAt || 0, r.replyAt || 0);
    }
    if (daily[r._sentDay]) daily[r._sentDay].sent++;
    if (rep === 'رد' && daily[r._replyDay]) daily[r._replyDay].replies++;
  }
  const batches = (S.meta.batches || []).map(b => Object.assign({}, b, byBatch[b.id] || { total: 0, sent: 0, replied: 0, noReply: 0 }, { coordName: userName(b.coordId) || '—' })).reverse();
  const coords = (S.meta.coords || []).map(c => Object.assign({}, c, byCoord[c.id] || { sentTotal: 0, sentToday: 0, replied: 0, noReply: 0, pending: 0, last: 0 }));
  return { totals: T, batches, coords, cities: Object.values(byCity).sort((a, b) => b.total - a.total), daily: Object.keys(daily).map(k => ({ day: k, sent: daily[k].sent, replies: daily[k].replies })) };
}

/* ═══════════════ قائمة المأذونين (المدير) ═══════════════ */
function filterPeople(q) {
  const text = String(q.text || '').trim();
  const dg = latin(text).replace(/[\s+\-]/g, '');
  const onlyDigits = /^\d{3,}$/.test(dg);
  const d = dg.replace(/^0+/, '');
  const tokens = text && !onlyDigits ? norm(text).split(' ').filter(Boolean) : [];
  const want = { active: ACTIVE, dup: 'مكرر', excluded: 'مستبعد', deleted: 'محذوف' }[q.recordStatus || 'active'];
  return DB.list.filter(r => {
    if (want && r.recordStatus !== want) return false;
    if (q.city && r.city !== q.city) return false;
    if (q.batchId === 'none') { if (r.batchId) return false; } else if (q.batchId && r.batchId !== q.batchId) return false;
    if (q.sendStatus && r.sendStatus !== q.sendStatus) return false;
    if (q.replyStatus) { if (q.replyStatus === 'pending') { if (r.sendStatus !== SENT || r.replyStatus) return false; } else if (r.replyStatus !== q.replyStatus) return false; }
    if (q.phone === 'ok' && r.phoneStatus !== OK) return false;
    if (q.phone === 'problem' && r.phoneStatus === OK) return false;
    if (q.alerts && !r.alert) return false;
    if (onlyDigits) return r._d.indexOf(d) > -1;
    for (const t of tokens) if (r._s.indexOf(t) < 0) return false;
    return true;
  });
}
function citiesList() {
  const m = {};
  DB.list.forEach(r => { if (r.recordStatus !== ACTIVE) return; const c = r.city || '(بدون مدينة)'; const o = m[c] || (m[c] = { city: c, total: 0, free: 0 }); o.total++; if (r.phoneStatus === OK && r.sendStatus !== SENT && !r.batchId) o.free++; });
  return Object.values(m).sort((a, b) => b.total - a.total);
}

    ${open.length ? `<select class="in" id="bkTo" style="width:auto;padding:5px 8px"><option value="">أضف إلى دفعة…</option>${open.map(x => opt(x.id, x.name)).join('')}</select>` : ''}
    <button class="btn ghost sm" id="bkExcl">استبعاد</button>
    <button class="btn ghost sm" id="bkAct">إرجاع نشطاً</button>
    <button class="btn ghost sm" id="bkDup">تعليم كمكرر</button>
  </div>`;
  const ids = () => Array.from(S.sel);
  if ($('#selAll')) $('#selAll').addEventListener('click', () => { S.filtered.forEach(r => S.sel.add(r.id)); S.body(); });
  $('#selNone').addEventListener('click', () => { S.sel.clear(); S.body(); });
  $('#bkNew').addEventListener('click', () => { S.preIds = ids(); go('batches'); });
  if ($('#bkTo')) $('#bkTo').addEventListener('change', e => {
    const bid = e.target.value; if (!bid) return;
    busy(null, async () => {
      const r = await call('api_batchAdd', bid, ids());
      toast(`أضيف ${r.assigned} اسماً${r.skipped ? '، وتُرك ' + r.skipped + ' (مرسل لهم أو في دفعة أخرى أو أرقامهم غير سليمة)' : ''}.`);
      S.sel.clear(); await sync();
    });
  });
  const setSt = (st, label) => e => {
    if (!confirm(`${label} ${ids().length} مأذوناً؟`)) return;
    busy(e.currentTarget, async () => { const r = await call('api_setRecordStatus', ids(), st); toast(`تم: ${r.changed}`); S.sel.clear(); await sync(); });
  };
  $('#bkExcl').addEventListener('click', setSt('مستبعد', 'استبعاد'));
  $('#bkAct').addEventListener('click', setSt(ACTIVE, 'إرجاع'));
  $('#bkDup').addEventListener('click', setSt('مكرر', 'تعليم كمكرر'));
}

/* ─── التعديل والإضافة (تفتح فوراً من البيانات المحلية) ─── */
function openEdit(id) {
  const r = id ? rec(id) : { name: '', phoneRaw: '', city: '', district: '', license: '', contractType: '', court: '', notes: '', sender: '', sendStatus: NOTSENT, replyStatus: '', recordStatus: ACTIVE };
  if (!r) return toast('السجل غير موجود.', 'err');
  const f = (k, label, extra) => `<div class="${extra || ''}"><label class="f" for="e_${k}">${label}</label><input class="in" id="e_${k}" value="${esc(r[k])}"></div>`;
  const m = openModal(`
    <header><div><h3>${id ? 'تعديل بيانات مأذون' : 'إضافة مأذون'}</h3>${id ? `<p><span class="num">${esc(r.id)}</span><span>${esc((batchOf(r.batchId) || {}).name || 'بدون دفعة')}</span></p>` : ''}</div><button class="x" data-close aria-label="إغلاق">×</button></header>
    <div class="body">
      <div class="fields">
        ${f('name', 'الاسم', 'wide')}
        <div><label class="f" for="e_phoneRaw">الجوال</label><input class="in" id="e_phoneRaw" dir="ltr" style="text-align:right" value="${esc(r.phoneRaw)}"><div class="small">${id ? (r.phoneStatus === OK ? `<span style="color:var(--green)">سليم: ${esc(r.phone)}</span>` : `<span style="color:var(--red)">${esc(r.phoneStatus)}</span>`) : ''}</div></div>
        ${f('city', 'المدينة')}${f('district', 'الحي')}${f('license', 'رقم الترخيص')}
        ${f('contractType', 'نوع العقد (يظهر تحت الشعار)')}${f('court', 'المحكمة')}
        <div class="wide"><label class="f" for="e_sender">المُهدي لهذا المأذون فقط <span class="muted">(اتركه فارغاً ليأخذ مُهدي الدفعة)</span></label><input class="in" id="e_sender" value="${esc(r.sender)}" placeholder="${esc(S.meta.settings.sender)}"></div>
        ${id ? `
        <div><label class="f" for="e_sendStatus">حالة الإرسال</label><select class="in" id="e_sendStatus">${opt(NOTSENT, NOTSENT, r.sendStatus)}${opt(SENT, SENT, r.sendStatus)}</select></div>
        <div><label class="f" for="e_replyStatus">حالة الرد</label><select class="in" id="e_replyStatus">${opt('', '—', r.replyStatus)}${opt('رد', 'رد', r.replyStatus)}${opt('لم يرد', 'لم يرد', r.replyStatus)}</select></div>
        <div><label class="f" for="e_recordStatus">حالة السجل</label><select class="in" id="e_recordStatus">${[ACTIVE, 'مستبعد', 'مكرر', 'محذوف'].map(x => opt(x, x, r.recordStatus)).join('')}</select></div>` : ''}
        <div class="wide"><label class="f" for="e_notes">ملاحظات</label><textarea class="in" id="e_notes">${esc(r.notes)}</textarea></div>
      </div>
      ${id ? `<dl class="kv" style="margin-top:16px">
        <dt>أُرسل</dt><dd class="num">${esc(fmt(r.sentAt) || '—')} ${r.sentBy ? '— ' + esc(userName(r.sentBy)) : ''}</dd>
        <dt>الرد</dt><dd class="num">${esc(fmt(r.replyAt) || '—')}</dd>
        <dt>آخر تعديل</dt><dd class="num">${esc(fmt(r.updatedAt))} — ${esc(r.updatedBy)}</dd>
        ${r.alert ? `<dt>تنبيه</dt><dd style="color:var(--amber)">${esc(r.alert)}</dd>` : ''}</dl>` : ''}
    </div>
    <footer><span class="row">${id && r.phoneStatus === OK ? '<button class="btn ghost" id="eId">فتح الهوية</button>' : ''}</span>
      <span class="row"><button class="btn ghost" data-close>إلغاء</button><button class="btn" id="eSave" data-busy="جارٍ الحفظ…">حفظ</button></span></footer>`, true);
  $('#e_name', m).focus();
  if ($('#eId', m)) $('#eId', m).addEventListener('click', () => openIdentity(id));
  $('#eSave', m).addEventListener('click', e => busy(e.currentTarget, async () => {
    const keys = ['name', 'phoneRaw', 'city', 'district', 'license', 'contractType', 'court', 'sender', 'notes'].concat(id ? ['sendStatus', 'replyStatus', 'recordStatus'] : []);
    const patch = {};
    keys.forEach(k => { const el = $('#e_' + k, m); if (el && (!id || String(el.value) !== String(r[k] || ''))) patch[k] = el.value; });
    if (!id) {
      let res = await call('api_add', patch);
      if (res.duplicate) {
        if (!confirm(`يوجد مأذون بنفس الجوال أو الترخيص: ${res.duplicate.id} — ${res.duplicate.name}\nهل تريد إضافته مع ذلك؟`)) return;
        patch.force = true; res = await call('api_add', patch);
      }
      const x = unpack(res.data)[0]; upsert([x]); toast('أُضيف ' + x.name + ' (' + x.id + ')');
    } else {
      if (!Object.keys(patch).length) { closeModal(); return; }
      const res = await call('api_save', id, patch);
      const x = unpack(res.data)[0]; upsert([x]);
      toast(res.changed.length ? 'حُفظ التعديل: ' + res.changed.join('، ') : 'لا تغيير.');
      if (x.alert && patch.phoneRaw) toast(x.alert, 'warn');
    }
    closeModal(); refreshView();
  }));
}

/* ═══════════════ الدفعات (المدير) ═══════════════ */
function viewBatches(v) {
  const pre = S.preIds; S.preIds = null;
  const coordOpts = (S.meta.coords || []).filter(c => c.active).map(c => opt(c.id, c.name + (c.role === 'مدير' ? ' (مدير)' : ''))).join('');
  v.innerHTML = `
  <h2 class="page">الدفعات</h2>
  <p class="lead">اختر المدينة والعدد، فيُختار أول الأسماء المتاحة تلقائياً، ثم أضف أو أزل من تشاء قبل الاعتماد.</p>
  <section class="panel" id="builder">
    <h3>${pre ? `دفعة جديدة من ${pre.length} اسماً حددتها` : 'دفعة جديدة'}</h3>
    <div class="fields">
      ${pre ? '' : `<div><label class="f" for="bCity">المدينة</label><select class="in" id="bCity"><option value="">— اختر —</option>${citiesList().map(c => opt(c.city, `${c.city} (متاح ${c.free} من ${c.total})`)).join('')}</select></div>
      <div><label class="f" for="bCount">العدد</label><input class="in num" id="bCount" type="number" min="1" value="50"></div>`}
      <div><label class="f" for="bCoord">المنسق</label><select class="in" id="bCoord"><option value="">— اختر —</option>${coordOpts}</select></div>
      <div><label class="f" for="bSender">المُهدي (يظهر في الهوية)</label><input class="in" id="bSender" placeholder="${esc(S.meta.settings.sender)}"></div>
      <div><label class="f" for="bName">اسم الدفعة <span class="muted">(اختياري)</span></label><input class="in" id="bName" placeholder="يُسمّى تلقائياً: المدينة — دفعة 1"></div>
    </div>
    ${pre ? '<div class="row" style="margin-top:14px"><button class="btn" id="bCreate" data-busy="جارٍ الاعتماد…">اعتمد الدفعة</button><button class="btn ghost" id="bBack">رجوع للقائمة</button></div>' : ''}
    <div id="cands"></div>
  </section>
  <section style="margin-top:18px"><h3>كل الدفعات</h3><div id="bList"></div></section>`;

  const create = (btn, ids) => busy(btn, async () => {
    const p = { ids, city: pre ? '' : $('#bCity').value, coordId: $('#bCoord').value, sender: $('#bSender').value, name: $('#bName').value };
    if (!p.coordId) throw new Error('اختر المنسق.');
    if (!ids.length) throw new Error('لم تحدد أي اسم.');
    const r = await call('api_createBatch', p);
    toast(`اعتُمدت «${r.name}»: ${r.assigned} اسماً${r.skipped ? '، وتُرك ' + r.skipped + ' غير متاح' : ''}.`);
    S.sel.clear(); S.cand = null; await sync(); go('batches');
  });
  if (pre) {
    $('#bCreate').addEventListener('click', e => create(e.currentTarget, pre));
    $('#bBack').addEventListener('click', () => go('people'));
  } else {
    const pick = () => {
      const city = $('#bCity').value, count = Math.max(1, parseInt(latin($('#bCount').value), 10) || 50);
      if (!city) { $('#cands').innerHTML = ''; S.cand = null; return; }
      const avail = DB.list.filter(r => r.recordStatus === ACTIVE && r.phoneStatus === OK && r.sendStatus !== SENT && !r.batchId && r.city === city);
      S.cand = { rows: avail, count, picked: new Set(avail.slice(0, count).map(x => x.id)), filter: '' };
      renderCands(create);
    };
    $('#bCity').addEventListener('change', pick);
    $('#bCount').addEventListener('input', debounce(pick, 250));
  }
  const body = () => {
    const st = computeStats(), el = $('#bList'); if (!el) return;
    el.innerHTML = st.batches.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الدفعة</th><th>المدينة</th><th>المنسق</th><th>المُهدي</th><th>العدد</th><th>أُرسل</th><th>ردوا</th><th>لم يردوا</th><th style="width:16%">التقدّم</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${st.batches.map(b => `<tr data-b="${esc(b.id)}"><td class="name">${esc(b.name)}<div class="small muted num">${esc(b.id)} — ${esc(fmt(b.createdAt))}</div></td><td>${esc(b.city)}</td><td>${esc(b.coordName)}</td><td class="small">${esc(b.sender || S.meta.settings.sender)}</td>
      <td class="num">${n0(b.total)}</td><td class="num">${n0(b.sent)}</td><td class="num">${n0(b.replied)}</td><td class="num">${n0(b.noReply)}</td>
      <td><div class="bar"><i style="width:${pct(b.sent, b.total)}%"></i><i class="r" style="width:${pct(b.replied, b.total)}%"></i></div></td>
      <td><span class="chip ${b.status === 'مفتوحة' ? 'sent' : b.status === 'مكتملة' ? 'yes' : 'off'}">${esc(b.status)}</span></td>
      <td class="acts"><button class="btn ghost sm" data-list>الأسماء</button> ${b.status !== 'ملغاة' ? '<button class="btn ghost sm" data-ed>تعديل</button>' : ''}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="panel empty">لا توجد دفعات بعد.</div>';
    $$('tr[data-b]', el).forEach(tr => {
      const b = st.batches.find(x => x.id === tr.dataset.b);
      $('[data-list]', tr).addEventListener('click', () => { S.q = { page: 1, recordStatus: 'active', batchId: b.id }; go('people'); });
      const ed = $('[data-ed]', tr); if (ed) ed.addEventListener('click', () => editBatch(b));
    });
  };
  S.body = body; body();
}

function renderCands(create) {
  const C = S.cand, box = $('#cands'); if (!box || !C) return;
  const f = norm(C.filter || ''), fd = latin(C.filter || '').replace(/\D/g, '');
  const shown = (f ? C.rows.filter(r => r._s.indexOf(f) > -1 || (fd.length > 2 && r._d.indexOf(fd.replace(/^0+/, '')) > -1)) : C.rows).slice(0, 600);
  box.innerHTML = `
  <div class="row" style="margin:16px 0 10px;justify-content:space-between">
    <span>المتاح في المدينة: <b class="num">${n0(C.rows.length)}</b> — المحدد: <b class="num" id="pickedN">${n0(C.picked.size)}</b></span>
    <span class="row"><input class="in" id="cFilter" placeholder="بحث داخل القائمة" style="width:200px" value="${esc(C.filter || '')}">
      <button class="btn ghost sm" id="cFirst">حدد أول ${n0(C.count)}</button><button class="btn ghost sm" id="cNone">إلغاء التحديد</button></span>
  </div>
  ${C.rows.length ? `<div class="cands"><table class="tbl"><thead><tr><th></th><th>المعرّف</th><th>الاسم</th><th>الجوال</th><th>الترخيص</th></tr></thead><tbody>
  ${shown.map(r => `<tr data-c="${esc(r.id)}" class="${C.picked.has(r.id) ? 'sel' : ''}"><td><input type="checkbox" ${C.picked.has(r.id) ? 'checked' : ''} aria-label="${esc(r.name)}"></td><td class="num small muted">${esc(r.id)}</td><td class="name">${esc(r.name)}${r.alert ? `<div class="small" style="color:var(--amber)">⚠ ${esc(r.alert)}</div>` : ''}</td><td class="ltr num">${esc(r.phoneLocal)}</td><td class="num">${esc(r.license)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="cCreate" data-busy="جارٍ الاعتماد…">اعتمد الدفعة (${n0(C.picked.size)})</button></div>`
  : '<div class="empty">لا يوجد أسماء متاحة في هذه المدينة (كلها في دفعات أو أُرسل لها أو أرقامها تحتاج تصحيحاً).</div>'}`;
  $('#cFilter').addEventListener('input', debounce(e => { C.filter = e.target.value; const p = e.target.selectionStart; renderCands(create); const el = $('#cFilter'); el.focus(); el.setSelectionRange(p, p); }, 150));
  $('#cFirst').addEventListener('click', () => { C.picked = new Set(C.rows.slice(0, C.count).map(x => x.id)); renderCands(create); });
  $('#cNone').addEventListener('click', () => { C.picked.clear(); renderCands(create); });
  $$('tr[data-c]', box).forEach(tr => $('input', tr).addEventListener('change', e => {
    e.target.checked ? C.picked.add(tr.dataset.c) : C.picked.delete(tr.dataset.c);
    tr.classList.toggle('sel', e.target.checked); $('#pickedN').textContent = n0(C.picked.size);
    $('#cCreate').textContent = `اعتمد الدفعة (${n0(C.picked.size)})`;
  }));
  if ($('#cCreate')) $('#cCreate').addEventListener('click', e => create(e.currentTarget, Array.from(C.picked)));
}

function editBatch(b) {

    <div class="body"><div class="fields">

    </div></div>
    <footer><button class="btn danger" id="xCancel">إلغاء الدفعة</button>
      <span class="row"><button class="btn ghost" data-close>رجوع</button><button class="btn" id="xSave" data-busy="جارٍ الحفظ…">حفظ</button></span></footer>`, true);
  $('#xSave', m).addEventListener('click', e => busy(e.currentTarget, async () => {
    await call('api_batchUpdate', b.id, { name: $('#x_name', m).value, coordId: $('#x_coord', m).value, status: $('#x_status', m).value, sender: $('#x_sender', m).value });

  });
}

/* رمز عشوائي من ١٠ خانات (حروف وأرقام، بلا الأحرف المتشابهة مثل O و0) */
function randomCode() {
  const L = 'abcdefghjkmnpqrstuvwxyz', D = '23456789', all = L + D, a = new Uint32Array(10);
  crypto.getRandomValues(a);
  const out = Array.from(a, n => all[n % all.length]);
  out[a[0] % 10] = D[a[1] % D.length];
  out[(a[0] + 5) % 10] = L[a[2] % L.length];
  return out.join('');
}

/* ─── تعديلات فورية: تظهر مباشرة ثم تُحفظ في الخلفية، وتُعاد إن فشل الحفظ ─── */
async function optimistic(id, change, server, okMsg) {
  const before = Object.assign({}, rec(id));
  const after = prep(Object.assign({}, before, change));
  upsert([after]); refreshView();
  try {
    const res = await server();
    upsert(unpack(res.data));
    if (okMsg) toast(okMsg);
  } catch (e) {
    upsert([prep(before)]); fail(e);
  }
  refreshView();
  return rec(id);
}
const setReply = (id, status, note) => optimistic(id,
  Object.assign({}, status !== null ? { replyStatus: status, replyAt: status ? Date.now() : 0 } : {}, note !== null ? { notes: note } : {}),
  () => call('api_setReply', id, status, note), status !== null ? (status ? 'سُجّل: ' + status : 'أُلغيت حالة الرد.') : 'حُفظت الملاحظة.');

  /* يرسم حالة الخطوات من السجل الحالي */
  const paintState = () => {
    const x = rec(id), sent = x.sendStatus === SENT, replied = x.replyStatus === 'رد';
    $('#st2', m).classList.toggle('done', sent);
    $('#st3', m).classList.toggle('locked', !sent);
    $('#st3', m).classList.toggle('done', !!x.replyStatus);
    $('#sentLine', m).innerHTML = sent ? `<div class="sentline">✓ ${greet ? 'أُرسلت التحية' : 'تم الإرسال'} <span class="num">${esc(fmt(x.sentAt))}</span>${x.replyStatus ? '' : '<button class="btn ghost sm" id="undoSent">تراجع</button>'}</div>` : '';
    $$('.choice button', m).forEach(b => b.setAttribute('aria-pressed', sent && b.dataset.r === (x.replyStatus || '')));
    const u = $('#undoSent', m);
    if (u) u.addEventListener('click', () => optimistic(id, { sendStatus: NOTSENT, sentAt: 0, sentBy: '', fileSentAt: 0 }, () => call('api_undoSent', id), 'أُلغي تسجيل الإرسال.').then(after));
    if (greet) {
      $('#st4', m).classList.toggle('locked', !replied);
      $('#st4', m).classList.toggle('done', !!x.fileSentAt);
      $('#fileLine', m).innerHTML = x.fileSentAt ? `<div class="sentline">✓ أُرسلت الهوية <span class="num">${esc(fmt(x.fileSentAt))}</span><button class="btn ghost sm" id="undoFile">تراجع</button></div>` : '';
      const uf = $('#undoFile', m);
      if (uf) uf.addEventListener('click', () => optimistic(id, { fileSentAt: 0 }, () => call('api_markFileSent', id, false), 'أُلغي تسجيل إرسال الهوية.').then(after));
    }
    cooldownPaint();
    if (!isAdmin) renderToday(sentTodayMine());
  };
  const after = () => { if (document.body.contains(m)) paintState(); };

  /* الفاصل الزمني بين رسائل الأشخاص الجدد (حماية من الحظر) */
  const firstBtn = $('#wa_' + firstType, m);
  const cooldownPaint = () => {
    clearInterval(m._cd);
    const tick = () => {
      if (!document.body.contains(m)) return clearInterval(m._cd);
      const left = cooldownLeft(), sent = rec(id).sendStatus === SENT, el = $('#cd_' + firstType, m);
      const wait = !sent && left > 0;
      firstBtn.classList.toggle('disabled', wait);
      if (el) el.innerHTML = wait ? `⏳ انتظر <span class="num" style="font-weight:700">${left}</span> ثانية قبل رسالة جديدة، حمايةً لرقمك من الحظر.` : '';
      if (!wait) clearInterval(m._cd);
    };
    tick(); m._cd = setInterval(tick, 1000);
  };
  paintState();

  let d = Studio.prepare(idt.data);
  const paint = () => { Studio.renderTo($('#pvCard', m), Studio.D.cardBack, d, 0.6); Studio.renderTo($('#pvPost', m), Studio.D.postGreen, d, 0.42); };
  requestAnimationFrame(paint); Studio.ready.then(() => { if (document.body.contains(m)) paint(); });

  $('#dBook', m).addEventListener('click', e => busy(e.currentTarget, async () => {
    await Studio.ready; await new Promise(res => setTimeout(res, 30));
    saveBlob(Studio.bookPdf(d), `دليل-الهوية-${slug(r.name)}.pdf`);
    const s1 = $('#st1', m); if (s1) s1.classList.add('done');
  }));
  $('#dZip', m).addEventListener('click', e => busy(e.currentTarget, async () => { await Studio.ready; saveBlob(await Studio.zipAll(d, slug(r.name)), `هوية-${slug(r.name)}.zip`); }));
  $('#dCard', m).addEventListener('click', e => busy(e.currentTarget, async () => {
    await Studio.ready; const it = Studio.ITEMS.find(x => x.key === 'cardBack');
    saveBlob(await Studio.canvasBlob(Studio.full(it, d)), `بطاقة-${slug(r.name)}.png`);
  }));

  // أول رسالة (تحية أو مباشرة): تسجّل الإرسال فوراً، والفاصل الزمني يبدأ فقط إن نجح التسجيل
  firstBtn.addEventListener('click', e => {
    if (rec(id).sendStatus === SENT) return;
    if (cooldownLeft() > 0) { e.preventDefault(); return toast('انتظر انتهاء الفاصل الزمني حمايةً لرقمك.', 'warn'); }
    rememberTemplate(firstType, $('#mb_' + firstType, m)._tpl);
    optimistic(id, Object.assign({ sendStatus: SENT, sentAt: Date.now(), sentBy: S.user.id }, greet ? {} : { fileSentAt: Date.now() }), () => call('api_markSent', id)).then(x => {
      if (x && x.sendStatus === SENT) startCooldown();
      after();
      const L = Number(S.meta.settings.dailyLimit) || 0, n = sentTodayMine();
      if (!isAdmin && L && n >= L) toast(`وصلت ${n} رسالة اليوم (الحد ${L}). يُستحسن التوقف حمايةً للرقم.`, 'warn');
    });
    after();
  });
  // رسالة الهوية بعد رده: لا تحتاج فاصلاً لأنه رد عليك
  if (greet) $('#wa_file', m).addEventListener('click', e => {
    if (rec(id).replyStatus !== 'رد') { e.preventDefault(); return toast('أرسل الهوية بعد أن يرد على التحية.', 'warn'); }
    if (rec(id).fileSentAt) return;
    rememberTemplate('file', $('#mb_file', m)._tpl);
    optimistic(id, { fileSentAt: Date.now() }, () => call('api_markFileSent', id, true)).then(after); after();
  });
  $$('.choice button', m).forEach(b => b.addEventListener('click', () => {
    if (rec(id).sendStatus !== SENT) return toast('أرسل الرسالة الأولى قبل تسجيل الرد.', 'warn');
    setReply(id, b.dataset.r, null).then(after); after();
  }));
  $('#sNote', m).addEventListener('click', () => setReply(id, null, $('#iNote', m).value));
  $('#idEdit', m).addEventListener('click', () => identityEditor(id, m, nd => { d = Studio.prepare(nd); paint(); }));
  if (i > 0) $('#nPrev', m).addEventListener('click', () => openIdentity(nav[i - 1]));
  if (i > -1 && i < nav.length - 1) $('#nNext', m).addEventListener('click', () => openIdentity(nav[i + 1]));
  if ($('#toEdit', m)) $('#toEdit', m).addEventListener('click', () => openEdit(id));
}

/* ═══════════════ تنويع الرسائل والفاصل الزمني (حماية من الحظر) ═══════════════ */
const isGreetMode = () => (S.meta.settings.sendMode || 'تحية أولاً') !== 'مباشرة';
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; };
function rememberTemplate(type, idx) { const k = 'mz_last_' + type; const a = JSON.parse(store.get(k) || '[]'); a.unshift(idx); store.set(k, JSON.stringify(a.slice(0, 8))); }
/* يختار رسالة مختلفة لكل مأذون، ويتجنب آخر الرسائل التي استُخدمت قبله مباشرة */
function pickMessage(x, type, shift) {
  const list = ((S.meta.templates || {})[type] || []);
  const idt = identityOf(x), dd = idt.data;
  if (!list.length) return { text: idt.message, index: 0, count: 0 };
  const recent = JSON.parse(store.get('mz_last_' + type) || '[]');
  let k = hashStr(x.id + type) % list.length;
  for (let t = 0; t < list.length && recent.slice(0, Math.min(5, list.length - 1)).indexOf(k) > -1; t++) k = (k + 1) % list.length;
  k = (k + (shift || 0)) % list.length;
  const words = String(dd.name).replace(/^(الشيخ|فضيلة الشيخ|الشيخ\/)\s*/, '').split(' ');
  const text = list[k].replace(/\{الاسم\}/g, dd.name).replace(/\{الأول\}/g, words[0] || dd.name)
    .replace(/\{المدينة\}/g, dd.hideCity ? '' : dd.city).replace(/\{المهدي\}/g, dd.sender).replace(/\{رقم_الترخيص\}/g, dd.hideLicense ? '' : dd.license)
    .replace(/\s+([،.؟])/g, '$1').replace(/ {2,}/g, ' ');
  return { text, index: k, count: list.length };
}
/* مؤقت كل مستخدم يحدده المدير من «المنسقون»: تشغيل/إيقاف ومدة تُختار من قائمة */
const GAPS = [['15', '15 ثانية'], ['30', '30 ثانية'], ['45', '45 ثانية'], ['60', 'دقيقة'], ['90', 'دقيقة ونصف'], ['120', 'دقيقتان'],
  ['30-60', 'عشوائي بين 30 و60 ثانية'], ['45-120', 'عشوائي بين 45 و120 ثانية (الأكثر أماناً)'], ['60-180', 'عشوائي بين دقيقة و3 دقائق']];
const gapLabel = v => (GAPS.find(g => g[0] === v) || [v, v + ' ثانية'])[1];
const timerText = c => c.timer === 'لا' ? 'معطّل' : gapLabel(c.gap || S.meta.settings.gap || '45-120') + (c.gap ? '' : ' (الافتراضي)');
const gapOpts = (cur, withDefault) => (withDefault ? opt('', 'المدة الافتراضية من الإعدادات', cur) : '') + GAPS.map(g => opt(g[0], g[1], cur)).join('') +
  (cur && !GAPS.some(g => g[0] === cur) ? opt(cur, cur + ' ثانية', cur) : '');
const myTimer = () => (S.meta.coords || []).find(c => c.id === S.user.id) || {};
const timerOn = () => myTimer().timer !== 'لا';
function gapRange() { const m = latin(myTimer().gap || S.meta.settings.gap || '45-120').match(/(\d+)\D*(\d+)?/); const a = m ? +m[1] : 45, b = m && m[2] ? +m[2] : a; return [Math.min(a, b), Math.max(a, b)]; }
function startCooldown() { if (!timerOn()) return; const [a, b] = gapRange(); const sec = a + Math.floor(Math.random() * (b - a + 1)); S.cooldownUntil = Date.now() + sec * 1000; store.set('mz_cd', String(S.cooldownUntil)); }
function cooldownLeft() { if (!timerOn()) return 0; const u = S.cooldownUntil || +store.get('mz_cd') || 0; return Math.max(0, Math.ceil((u - Date.now()) / 1000)); }

/* ═══════════════ حفظ الأسماء في الجوال (ملف جهات اتصال vCard) ═══════════════ */
function vcardEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function buildVcf(rows, fmtName) {
  const out = [];
  rows.forEach(r => {
    if (!r.phone) return;
    const city = r.city || '';
    const name = fmtName === 'name' ? r.name : fmtName === 'prefix' ? `مأذون ${r.name}${city ? ' - ' + city : ''}` : `${r.name}${city ? ' - ' + city : ''}`;
    out.push('BEGIN:VCARD', 'VERSION:3.0', `N:;${vcardEsc(name)};;;`, `FN:${vcardEsc(name)}`, 'ORG:مأذون أنكحة',
      `TEL;TYPE=CELL:+${r.phone}`, city ? `ADR;TYPE=WORK:;;;${vcardEsc(city)};;;` : '', `NOTE:${vcardEsc('مأذون أنكحة' + (city ? ' - ' + city : '') + (r.license ? ' - ترخيص ' + r.license : ''))}`,
      'CATEGORIES:مأذونين', 'END:VCARD');
  });
  return out.filter(Boolean).join('\r\n') + '\r\n';
}
function openContactsExport(rowsAll, title) {
  const rows = rowsAll.filter(r => r.phone && r.recordStatus === ACTIVE);
  const cities = {}; rows.forEach(r => { const c = r.city || '(بدون مدينة)'; cities[c] = (cities[c] || 0) + 1; });
  const m = openModal(`
    <header><div><h3>حفظ الأسماء في الجوال</h3><p><span>${esc(title)}</span><span class="num">${n0(rows.length)} اسماً برقم سليم</span></p></div><button class="x" data-close aria-label="إغلاق">×</button></header>
    <div class="body"><div class="fields">
      <div><label class="f" for="vxCity">المدينة</label><select class="in" id="vxCity"><option value="">كل المدن (${n0(rows.length)})</option>${Object.keys(cities).sort((a, b) => cities[b] - cities[a]).map(c => opt(c, `${c} (${cities[c]})`)).join('')}</select></div>
      <div><label class="f" for="vxFmt">طريقة كتابة الاسم في الجوال</label><select class="in" id="vxFmt">${opt('city', 'الاسم - المدينة')}${opt('prefix', 'مأذون الاسم - المدينة')}${opt('name', 'الاسم فقط')}</select></div>
      <div class="wide"><p class="small muted" style="margin:0">مثال: <b id="vxEx"></b><br>يُحفظ مع كل اسم: الجوال، والمدينة، ورقم الترخيص في الملاحظات. الملف يعمل في الآيفون والأندرويد وجهات اتصال جوجل.</p></div>
    </div></div>
    <footer><span></span><span class="row"><button class="btn ghost" data-close>إلغاء</button><button class="btn" id="vxGo">تنزيل ملف جهات الاتصال</button></span></footer>`, true);
  const ex = () => { const r = rows[0] || { name: 'إبراهيم بن سعد العرابي', city: 'مكة المكرمة' }; const f = $('#vxFmt', m).value, c = r.city || '';
    $('#vxEx', m).textContent = f === 'name' ? r.name : f === 'prefix' ? `مأذون ${r.name}${c ? ' - ' + c : ''}` : `${r.name}${c ? ' - ' + c : ''}`; };
  ex(); $('#vxFmt', m).addEventListener('change', ex);
  $('#vxGo', m).addEventListener('click', () => {
    const c = $('#vxCity', m).value, sel = c ? rows.filter(r => (r.city || '(بدون مدينة)') === c) : rows;
    if (!sel.length) return toast('لا توجد أسماء.', 'warn');
    saveBlob(new Blob([buildVcf(sel, $('#vxFmt', m).value)], { type: 'text/vcard;charset=utf-8' }), `مأذونين-${slug(c || 'الكل')}-${sel.length}.vcf`);
    toast(`نُزّل ملف فيه ${sel.length} اسماً.`); closeModal();
  });
}

/* ═══════════════ تعديل الهوية بطلب المأذون ═══════════════
   يغيّر ما يظهر في الهوية فقط. البيانات الأصلية ورقم الواتساب لا تتغير. */
function identityEditor(id, m, repaint) {
  const x = rec(id), base = identityBase(x), c = x._c || {};
  const val = k => c[k] || base[k];
  const box = $('#stepsBox', m);
  const field = (k, label, hint, ltr) => `<div class="${k === 'name' || k === 'sender' || k === 'tagline' ? 'wide' : ''}"><label class="f" for="ie_${k}">${label}</label>
    <input class="in" id="ie_${k}" value="${esc(val(k))}" ${ltr ? 'dir="ltr" style="text-align:right"' : ''}>${hint ? `<p class="small muted" style="margin:4px 0 0">${hint}</p>` : ''}</div>`;
  const chk = (k, label) => `<label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" id="ie_${k}" ${c[k] ? 'checked' : ''} style="width:17px;height:17px;accent-color:var(--green)"> ${label}</label>`;
  const holder = document.createElement('div');
  holder.innerHTML = `
    <h3 style="margin-bottom:4px">تعديل الهوية</h3>
    <p class="small muted" style="margin:0 0 14px">اكتب ما يطلبه المأذون، والمعاينة تتغير مباشرة. هذا يغيّر الهوية فقط، ولا يغيّر بياناته الأصلية ولا رقم الواتساب الذي تُرسل عليه.</p>
    <div class="fields">
      ${field('name', 'الاسم كما يظهر في الهوية', 'مثال: الشيخ فلان بن فلان')}
      ${field('phone', 'الجوال الظاهر في الهوية', 'يتغير معه رمز QR', true)}
      ${field('city', 'المدينة')}
      ${field('license', 'رقم الرخصة', '', true)}
      ${field('tagline', 'الوصف تحت الاسم')}
      ${field('sender', 'المُهدي')}
      <div class="wide row" style="gap:18px">${chk('hideCity', 'إخفاء المدينة')}${chk('hideLicense', 'إخفاء رقم الرخصة')}${chk('hideQr', 'إخفاء رمز QR')}</div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="ieSave" data-busy="جارٍ الحفظ…">حفظ التعديل</button>
      <button class="btn ghost" id="ieBack">رجوع دون حفظ</button>
      ${x._c ? '<button class="btn danger" id="ieReset" data-busy="لحظة…">إرجاع الهوية كما في البيانات</button>' : ''}
    </div>`;
  box.replaceWith(holder); holder.id = 'stepsBox';
  $('#idEdit', m).hidden = true;
  const read = () => {
    const o = {};
    ['name', 'phone', 'city', 'license', 'tagline', 'sender'].forEach(k => {
      let v = $('#ie_' + k, m).value.trim();
      if (k === 'phone' || k === 'license') v = latin(v).replace(/\s+/g, '');
      if (v && v !== String(base[k] || '')) o[k] = v;
    });
    ['hideCity', 'hideLicense', 'hideQr'].forEach(k => { if ($('#ie_' + k, m).checked) o[k] = true; });
    return o;
  };
  const live = debounce(() => repaint(identityOf(x, read()).data), 120);
  $$('input', holder).forEach(el => el.addEventListener('input', live));
  $$('input[type=checkbox]', holder).forEach(el => el.addEventListener('change', live));
  const save = (o, btn) => busy(btn, async () => {
    const res = await call('api_saveIdentity', id, o);
    upsert(unpack(res.data)); refreshView();
    toast(Object.keys(o).length ? 'حُفظ تعديل الهوية. نزّلها من جديد وأرسلها.' : 'أُرجعت الهوية كما في البيانات.');
    openIdentity(id);
  });
  $('#ieSave', m).addEventListener('click', e => save(read(), e.currentTarget));
  $('#ieBack', m).addEventListener('click', () => openIdentity(id));
  if ($('#ieReset', m)) $('#ieReset', m).addEventListener('click', e => { if (confirm('إرجاع الهوية كما في البيانات الأصلية؟')) save({}, e.currentTarget); });
  $('#ie_name', m).focus();
}

/* ═══════════════ التشغيل ═══════════════ */
(async function init() {
  const t = tokenStore.get('mz_token');
  if (t) {
    S.token = t;
    $('#app').innerHTML = '<div class="loading"><span class="spin"></span> جارٍ تحميل البيانات…</div>';
    try { start(await call('api_boot')); return; } catch (e) { S.token = null; tokenStore.set('mz_token', null); }
  }
  renderLogin();
})();
</script>
